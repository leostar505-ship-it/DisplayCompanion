name: Build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --windowed --name DisplayCompanion
          --icon assets/icon.ico --add-data "assets;assets"
          --hidden-import pyaudiowpatch --hidden-import serial.tools.list_ports
          run_screenlink.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayCompanion-Setup
          path: installer_output/DisplayCompanion-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/DisplayCompanion-Setup.exe
