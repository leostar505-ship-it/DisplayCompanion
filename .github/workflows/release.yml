name: Build installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: >
          python -m PyInstaller --noconfirm --windowed --name DisplayCompanion
          --icon assets/icon.ico --add-data "assets;assets"
          --hidden-import pyaudiowpatch --collect-all vosk --hidden-import serial.tools.list_ports
          run_screenlink.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path screenlink/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DisplayCompanion-Setup
          path: installer_output/DisplayCompanion-Setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Display Companion ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: installer_output/DisplayCompanion-Setup.exe
